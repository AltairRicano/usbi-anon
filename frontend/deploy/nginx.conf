# nginx sustituye a `vite preview` (M3.8): compresión, caché por huella de
# archivo, cabeceras de seguridad, y el fin de `preview.allowedHosts` —
# `vite preview` respondía 403 a cualquier Host no listado a mano; nginx no
# tiene ese problema porque no inspecciona el Host para decidir si sirve.
#
# Sin TLS todavía: el nombre y dominio definitivos del producto siguen sin
# decidirse (una de las cuatro decisiones abiertas del plan de maduración).
# Server_name "_" acepta cualquier Host mientras tanto. Cuando haya dominio y
# certificado, agregar un segundo server{} en 443 con ssl_certificate/
# ssl_certificate_key y redirigir este bloque de 80 a HTTPS — no antes,
# porque emitir certificados exige que el dominio ya resuelva a este host.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # apiClient.ts ya resuelve apiBaseURL = '/api/v1' relativo (M3.8): el
    # navegador pega contra el mismo origen que sirvió la página, y este
    # proxy es lo que hace real esa suposición. `api` es el nombre del
    # servicio en docker-compose.yml, resuelto por la red interna de compose.
    location /api/ {
        proxy_pass http://api:8088/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Huella de contenido en el nombre de archivo (Vite ya la genera) —
    # cacheable de forma agresiva y segura: un cambio de contenido siempre
    # es un nombre de archivo distinto.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
